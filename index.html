<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#0a0a0a;
            color:#ccc;
            font-family:'Courier New',monospace;

            background:#111;

        .panel-header{
            background:#1a1a1a;

            display:flex;
            justify-content:space-between;

        .panel-header.green{color:#44ff44;}
        textarea{
            flex:1;
            background:#0a0a0a;

        @media(max-width:768px){

        }
    </style>
</head>
<body>

<header>
    <h1>🔓 WRD DEOBFUSCATOR</h1>
    <span>WeAreDevs / Prometheus — Lua via Fengari (WASM) — 100% Navegador</span>
</header>

<div class="container">
    <div class="panel">
        <div class="panel-header red">
            <span>🔒 SCRIPT OFUSCADO</span>
            <span style="font-size:10px;color:#ff4400">WRD / WeAreDevs</span>
        </div>
        <textarea id="input" placeholder="Cole o script ofuscado do WeAreDevs aqui...
        
Formatos suportados:
- WRD com tabela de bytes (\xxx\xxx)
- WRD com loadstring(game:HttpGet('...'))
- WRD com Base64
- Prometheus Obfuscator
- Qualquer versão WRD"></textarea>
        <div class="btn-row">
            <button class="primary" onclick="deobfuscate()">▶ DEOBFUSCAR (LUA REAL)</button>
            <button onclick="extractStrings()">📋 EXTRAIR STRINGS</button>
            <button onclick="clearAll()">✕ LIMPAR</button>
        </div>
    </div>
    
    <div class="panel">
        <div class="panel-header green">
            <span>✅ RESULTADO</span>
            <span style="font-size:10px;color:#44ff44" id="status">pronto</span>
        </div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div style="margin-top:10px;">Executando script em ambiente controlado...</div>
            <div style="font-size:10px;color:#666;margin-top:5px;">Isso pode levar alguns segundos</div>
        </div>
        <textarea id="output" placeholder="Resultado desofuscado aparece aqui..." readonly></textarea>
        <div class="btn-row">
            <button onclick="copyOutput()">📋 COPIAR</button>
            <button onclick="downloadOutput()">💾 BAIXAR .LUA</button>
            <button onclick="beautifyOutput()">✨ FORMATAR</button>
        </div>
    </div>
</div>

<div class="log" id="log">⚙️ Processando...</div>

<!-- Fengari - Lua 5.3 em WebAssembly -->
<script src="fengari-web.js"></script>

<script>
// ============================================================
// CONFIGURAÇÃO DO FENGARI
// ============================================================
let fengariReady = false;

// Inicializa o Fengari quando carregar
window.onload = function() {
    if (typeof fengari !== 'undefined') {
        fengariReady = true;
        console.log('%c🔧 Fengari (Lua WASM) carregado com sucesso!',
            'color:#44ff44;font-size:14px;');
    } else {
        console.warn('Fengari não carregou. Usando fallback estático.');
    }
};

// ============================================================
// FUNÇÃO PRINCIPAL DE DEOBFUSCAÇÃO
// ============================================================
async function deobfuscate() {
    const input = document.getElementById('input').value.trim();
    if (!input) { alert('Cola o script WRD primeiro.'); return; }
    
    // Mostra loading
    document.getElementById('loading').classList.add('active');
    document.getElementById('output').value = '';
    showLog('⚙️ Executando em ambiente Lua real...');
    
    let result = [];
    
    try {
        // PASSO 1: Extrair strings decodificadas (rápido)
        const strings = extractByteStrings(input);
        if (strings.length > 0) {
            result.push('-- ============================================');
            result.push('-- STRINGS DECODIFICADAS (' + strings.length + ' encontradas)');
            result.push('-- ============================================');
            strings.forEach((s, i) => {
                result.push(`local str_${i+1} = "${escapeLua(s)}"`);
            });
            result.push('');
        }
        
        // PASSO 2: Tentar executar com Fengari (Lua real)
        if (fengariReady) {
            const luaResult = await executeWithFengari(input);
            if (luaResult) {
                result.push('-- ============================================');
                result.push('-- RESULTADO DA EXECUÇÃO CONTROLADA');
                result.push('-- ============================================');
                result.push(luaResult);
            }
        } else {
            result.push('-- AVISO: Fengari não carregou. Use o PC para');
            result.push('-- execução Lua completa. Strings extraídas acima.');
        }
        
        // PASSO 3: Extrair URLs e metadados
        const urls = extractURLs(input);
        if (urls.length > 0) {
            result.push('');
            result.push('-- ============================================');
            result.push('-- URLs ENCONTRADAS');
            result.push('-- ============================================');
            urls.forEach(url => result.push('-- ' + url));
        }
        
        document.getElementById('output').value = result.join('\n');
        document.getElementById('status').textContent = 
            `${strings.length} strings | ${fengariReady ? 'Lua executado' : 'modo estático'}`;
        
    } catch (e) {
        document.getElementById('output').value = 
            `-- ERRO: ${e.message}\n-- Stack: ${e.stack}\n\n` +
            `-- Strings extraídas até o erro:\n${result.join('\n')}`;
        document.getElementById('status').textContent = 'erro';
    }
    
    document.getElementById('loading').classList.remove('active');
    hideLog();
}

// ============================================================
// EXECUÇÃO COM FENGARI (LUA REAL NO NAVEGADOR)
// ============================================================
async function executeWithFengari(script) {
    return new Promise((resolve) => {
        try {
            const output = [];
            
            // Cria ambiente fake que espiona tudo
            const fakeEnv = `
-- Ambiente falso para capturar tudo
local _captured = {}
local _string_count = 0

-- Sobrescreve print para capturar
local _real_print = print
print = function(...)
    local args = {...}
    local parts = {}
    for i, v in ipairs(args) do
        table.insert(parts, tostring(v))
    end
    local msg = table.concat(parts, "\\t")
    table.insert(_captured, msg)
end

-- Spy de loadstring
local _real_loadstring = loadstring or load
loadstring = function(s, chunkname)
    table.insert(_captured, "LOADSTRING: " .. tostring(#s) .. " bytes")
    if type(s) == "string" and #s > 20 then
        table.insert(_captured, "CONTENT: " .. string.sub(s, 1, 500))
    end
    return _real_loadstring(s, chunkname)
end
load = loadstring

-- Spy de HttpGet
if game and game.HttpGet then
    local _real_httpget = game.HttpGet
    game.HttpGet = function(self, url)
        table.insert(_captured, "URL: " .. tostring(url))
        return _real_httpget(self, url)
    end
end

-- Executa o script em modo protegido
local success, err = pcall(function()
    ${script.replace(/\\/g, '\\\\').replace(/`/g, '\\`')}
end)

if not success then
    table.insert(_captured, "ERRO: " .. tostring(err))
end

return table.concat(_captured, "\\n")
`;
            
            // Executa com Fengari
            const result = fengari.load(fakeEnv)();
            resolve(result || "Script executado sem output.");
            
        } catch (e) {
            resolve("Erro na execução Fengari: " + e.message);
        }
    });
}

// ============================================================
// EXTRAÇÃO DE STRINGS (BYTES ESCAPADOS)
// ============================================================
function extractByteStrings(code) {
    const strings = [];
    
    // Padrão: "\xxx\xxx\xxx"
    const pattern = /"((?:\\\d{3})+)"|'((?:\\\d{3})+)'/g;
    let match;
    
    while ((match = pattern.exec(code)) !== null) {
        const byteStr = match[1] || match[2];
        if (byteStr && byteStr.length > 6) {
            try {
                const decoded = decodeBytes(byteStr);
                if (decoded && decoded.length > 0 && !isGarbage(decoded)) {
                    strings.push(decoded);
                }
            } catch (e) {}
        }
    }
    
    // Remove duplicatas mantendo ordem
    return [...new Set(strings)];
}

function decodeBytes(byteStr) {
    const bytes = byteStr.match(/\\\d{3}/g);
    if (!bytes) return '';
    
    let result = '';
    for (const byte of bytes) {
        const num = parseInt(byte.substring(1), 10);
        result += String.fromCharCode(num);
    }
    return result;
}

function isGarbage(str) {
    const printable = str.replace(/[\x20-\x7E\u00C0-\u00FF]/g, '');
    return printable.length > str.length * 0.6;
}

// ============================================================
// EXTRAÇÃO RÁPIDA DE STRINGS
// ============================================================
function extractStrings() {
    const input = document.getElementById('input').value.trim();
    if (!input) { alert('Precisa de código.'); return; }
    
    const strings = extractByteStrings(input);
    let result = [];
    
    result.push('-- STRINGS DECODIFICADAS: ' + strings.length);
    result.push('-- ========================');
    strings.forEach((s, i) => {
        result.push(`[${i+1}] ${s}`);
    });
    
    // Também tenta Base64
    const b64Pattern = /["']([A-Za-z0-9+/=]{40,})["']/g;
    let b64Match;
    let b64Count = 0;
    while ((b64Match = b64Pattern.exec(input)) !== null) {
        try {
            const decoded = atob(b64Match[1]);
            if (decoded.includes('local') || decoded.includes('function')) {
                result.push(`\n-- BASE64 DECODIFICADO:`);
                result.push(decoded.substring(0, 1000));
                b64Count++;
            }
        } catch (e) {}
    }
    
    document.getElementById('output').value = result.join('\n');
    document.getElementById('status').textContent = 
        `${strings.length} strings | ${b64Count} base64`;
}

// ============================================================
// EXTRAÇÃO DE URLs
// ============================================================
function extractURLs(code) {
    const urls = [];
    const pattern = /https?:\/\/[^\s"')\]]+/g;
    let match;
    while ((match = pattern.exec(code)) !== null) {
        urls.push(match[0]);
    }
    return [...new Set(urls)];
}

// ============================================================
// UTILITÁRIOS
// ============================================================
function escapeLua(str) {
    return str.replace(/\\/g, '\\\\')
              .replace(/"/g, '\\"')
              .replace(/\n/g, '\\n')
              .replace(/\r/g, '\\r')
              .replace(/\t/g, '\\t');
}

function beautifyOutput() {
    const code = document.getElementById('output').value;
    let indent = 0;
    const lines = code.split('\n');
    const result = lines.map(line => {
        const trimmed = line.trim();
        if (trimmed.startsWith('end') || trimmed.startsWith('}') || 
            trimmed.startsWith(')') || trimmed.startsWith('until')) {
            indent = Math.max(0, indent - 1);
        }
        const indented = '    '.repeat(indent) + trimmed;
        if (trimmed.match(/\b(function|if|for|while|do|repeat)\b/) && 
            !trimmed.includes('end')) {
            indent++;
        }
        if (trimmed.startsWith('else') || trimmed.startsWith('elseif')) {
            indent = Math.max(0, indent - 1);
            const r = '    '.repeat(indent) + trimmed;
            indent++;
            return r;
        }
        return indented;
    });
    document.getElementById('output').value = result.join('\n');
}

function clearAll() {
    document.getElementById('input').value = '';
    document.getElementById('output').value = '';
    document.getElementById('status').textContent = 'pronto';
}

function copyOutput() {
    const output = document.getElementById('output');
    output.select();
    document.execCommand('copy');
    document.getElementById('status').textContent = 'copiado!';
    setTimeout(() => { document.getElementById('status').textContent = 'pronto'; }, 1500);
}

function downloadOutput() {
    const output = document.getElementById('output').value;
    const blob = new Blob([output], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `wrd_deobfuscated_${Date.now()}.lua`;
    a.click();
    URL.revokeObjectURL(url);
}

function showLog(msg) {
    const log = document.getElementById('log');
    log.textContent = msg;
    log.style.display = 'block';
}

function hideLog() {
    setTimeout(() => { document.getElementById('log').style.display = 'none'; }, 1500);
}

// CTRL+Enter = executar
document.getElementById('input').addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 'Enter') {
        deobfuscate();
    }
});
</script>
