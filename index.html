<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRD Deobfuscator — WeAreDevs</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;color:#ccc;font-family:'Courier New',monospace;min-height:100vh;display:flex;flex-direction:column}
        header{background:#111;border-bottom:2px solid #ff4400;padding:12px;text-align:center}
        header h1{color:#ff4400;font-size:18px;letter-spacing:2px}
        header span{color:#555;font-size:10px}
        .container{display:flex;flex:1;gap:8px;padding:8px;height:calc(100vh - 55px)}
        .panel{flex:1;display:flex;flex-direction:column;background:#111;border:1px solid #222;border-radius:4px;overflow:hidden}
        .panel-header{background:#1a1a1a;padding:8px 12px;font-size:11px;font-weight:bold;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
        .panel-header.red{color:#ff4400}
        .panel-header.green{color:#44ff44}
        textarea{flex:1;background:#0a0a0a;color:#ccc;border:none;padding:10px;font-family:'Courier New',monospace;font-size:10px;resize:none;outline:none;line-height:1.4}
        textarea::placeholder{color:#333}
        .btn-row{display:flex;gap:4px;padding:6px;background:#1a1a1a;border-top:1px solid #222}
        button{flex:1;padding:10px 6px;border:1px solid #333;background:#1a1a1a;color:#ccc;cursor:pointer;font-family:'Courier New',monospace;font-size:9px;font-weight:bold;letter-spacing:0.5px;transition:all 0.2s;border-radius:3px;white-space:nowrap}
        button:hover{background:#222;border-color:#555}
        button.primary{background:#2a0a00;border-color:#ff4400;color:#ff4400}
        button.primary:hover{background:#3a1500}
        button.primary:disabled{opacity:0.4;cursor:not-allowed}
        button.green{background:#002a00;border-color:#44ff44;color:#44ff44}
        .log{position:fixed;bottom:10px;right:10px;background:#000c;color:#ffaa00;padding:5px 10px;border-radius:3px;font-size:10px;border:1px solid #ffaa0044;display:none;z-index:99}
        .spinner{display:inline-block;width:14px;height:14px;border:2px solid #ffaa0044;border-top:2px solid #ffaa00;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:6px}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        #status{font-size:10px;transition:color 0.3s}
        #status.done{color:#44ff44}
        #status.error{color:#ff4444}
        #status.running{color:#ffaa00}
        @media(max-width:768px){.container{flex-direction:column}textarea{min-height:180px}}
    </style>
</head>
<body>

<header>
    <h1>🔓 WRD DEOBFUSCATOR</h1>
    <span>WeAreDevs / Prometheus — Lua 5.1 real no backend — Resultado limpo</span>
</header>

<div class="container">
    <div class="panel">
        <div class="panel-header red">
            <span>🔒 SCRIPT OFUSCADO</span>
            <span style="font-size:9px;color:#ff4400">cole aqui</span>
        </div>
        <textarea id="input" placeholder="Cole o script ofuscado do WeAreDevs aqui...

Suporta:
✓ WRD com tabela de bytes (\xxx)
✓ loadstring(game:HttpGet('...'))
✓ Base64
✓ Prometheus / vBeLua
✓ Todas as versões WRD"></textarea>
        <div class="btn-row">
            <button class="primary" id="btnDeobf" onclick="deobfuscate()">▶ DEOBFUSCAR</button>
            <button onclick="extractQuick()">📋 STRINGS</button>
            <button onclick="clearAll()">✕ LIMPAR</button>
        </div>
    </div>
    
    <div class="panel">
        <div class="panel-header green">
            <span>✅ RESULTADO</span>
            <span id="status">pronto</span>
        </div>
        <textarea id="output" placeholder="Resultado desofuscado aparece aqui..." readonly></textarea>
        <div class="btn-row">
            <button onclick="copyOutput()">📋 COPIAR</button>
            <button onclick="downloadOutput()">💾 BAIXAR</button>
            <button onclick="beautifyOutput()">✨ FORMATAR</button>
        </div>
    </div>
</div>

<div class="log" id="log"></div>

<script>
// ============================================================
// CONFIGURAÇÃO — Altere esta URL quando criar o backend
// ============================================================
const BACKEND_URL = 'https://SEU-APP.onrender.com'; // ← ALTERE AQUI DEPOIS

// ============================================================
// DEOBFUSCAÇÃO PRINCIPAL (envia pro backend)
// ============================================================
async function deobfuscate() {
    const input = document.getElementById('input').value.trim();
    if (!input) { alert('Cola o script primeiro.'); return; }
    
    const btn = document.getElementById('btnDeobf');
    const status = document.getElementById('status');
    const output = document.getElementById('output');
    
    btn.disabled = true;
    btn.textContent = '⏳ PROCESSANDO...';
    status.textContent = 'executando Lua 5.1...';
    status.className = 'running';
    output.value = '';
    showLog('⚙️ Enviando para backend...');
    
    try {
        const response = await fetch(`${BACKEND_URL}/deobfuscate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ script: input })
        });
        
        const data = await response.json();
        
        if (data.error) {
            output.value = `-- ERRO NO BACKEND:\n-- ${data.error}\n\n-- Trace parcial:\n${data.trace || ''}`;
            status.textContent = 'erro';
            status.className = 'error';
        } else {
            let result = '';
            
            if (data.constants) {
                result += '-- ============================================\n';
                result += '-- CONSTANTES DECODIFICADAS\n';
                result += '-- ============================================\n';
                result += data.constants + '\n\n';
            }
            
            if (data.trace) {
                result += '-- ============================================\n';
                result += '-- TRACE DE EXECUÇÃO\n';
                result += '-- ============================================\n';
                result += data.trace + '\n\n';
            }
            
            if (data.deobfuscated) {
                result += '-- ============================================\n';
                result += '-- CÓDIGO LIMPO (RECONSTRUÍDO)\n';
                result += '-- ============================================\n';
                result += data.deobfuscated;
            }
            
            output.value = result || '-- Script processado, mas sem output significativo.';
            status.textContent = 'concluído ✓';
            status.className = 'done';
            showLog('✅ Deobfuscado com sucesso!');
        }
    } catch (e) {
        output.value = `-- ERRO DE CONEXÃO:\n-- ${e.message}\n-- \n-- Verifique se o backend está rodando em:\n-- ${BACKEND_URL}`;
        status.textContent = 'sem conexão';
        status.className = 'error';
    }
    
    btn.disabled = false;
    btn.textContent = '▶ DEOBFUSCAR';
    setTimeout(() => hideLog(), 2000);
}

// ============================================================
// EXTRAÇÃO RÁPIDA DE STRINGS (modo offline)
// ============================================================
function extractQuick() {
    const input = document.getElementById('input').value.trim();
    if (!input) { alert('Precisa de código.'); return; }
    
    showLog('📋 Extraindo strings...');
    let result = [];
    
    // Extrai strings com bytes escapados
    const bytePattern = /"((?:\\\d{3})+)"|'((?:\\\d{3})+)'/g;
    const strings = [];
    let match;
    
    while ((match = bytePattern.exec(input)) !== null) {
        const byteStr = match[1] || match[2];
        if (byteStr && byteStr.length > 4) {
            const bytes = byteStr.match(/\\\d{3}/g);
            if (bytes) {
                let decoded = '';
                for (const b of bytes) {
                    decoded += String.fromCharCode(parseInt(b.substring(1), 10));
                }
                if (decoded.length > 0 && !/^[\x00-\x1F\x80-\x9F]+$/.test(decoded)) {
                    strings.push(decoded);
                }
            }
        }
    }
    
    // Remove duplicatas
    const unique = [...new Set(strings)];
    
    result.push(`-- STRINGS DECODIFICADAS: ${unique.length}`);
    result.push('-- ========================');
    unique.forEach((s, i) => {
        const escaped = s.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n');
        result.push(`[${i+1}] "${escaped}"`);
    });
    
    // Tenta decodificar Base64
    const b64Pattern = /["']([A-Za-z0-9+/=]{40,})["']/g;
    let b64Count = 0;
    while ((match = b64Pattern.exec(input)) !== null) {
        try {
            const decoded = atob(match[1]);
            if (decoded.includes('local') || decoded.includes('function') || decoded.includes('http')) {
                result.push(`\n-- BASE64 DECODIFICADO [${++b64Count}]:`);
                result.push(decoded.substring(0, 2000));
            }
        } catch(e) {}
    }
    
    // URLs
    const urls = input.match(/https?:\/\/[^\s"')\]]+/g) || [];
    if (urls.length > 0) {
        result.push('\n-- URLs ENCONTRADAS:');
        [...new Set(urls)].forEach(url => result.push('-- ' + url));
    }
    
    document.getElementById('output').value = result.join('\n');
    document.getElementById('status').textContent = `${unique.length} strings`;
    document.getElementById('status').className = 'done';
    hideLog();
}

// ============================================================
// UTILITÁRIOS
// ============================================================
function beautifyOutput() {
    const code = document.getElementById('output').value;
    let indent = 0;
    const result = code.split('\n').map(line => {
        const t = line.trim();
        if (/^(end|until|else|elseif)\b/.test(t)) indent = Math.max(0, indent - 1);
        const r = '    '.repeat(indent) + t;
        if (/\b(function|if|for|while|do|repeat)\b/.test(t) && !t.includes('end')) indent++;
        if (/^else\b/.test(t)) indent++;
        return r;
    });
    document.getElementById('output').value = result.join('\n');
}

function clearAll() {
    document.getElementById('input').value = '';
    document.getElementById('output').value = '';
    document.getElementById('status').textContent = 'pronto';
    document.getElementById('status').className = '';
}

function copyOutput() {
    const o = document.getElementById('output');
    o.select();
    document.execCommand('copy');
    document.getElementById('status').textContent = 'copiado!';
}

function downloadOutput() {
    const blob = new Blob([document.getElementById('output').value], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `wrd_clean_${Date.now()}.lua`;
    a.click();
}

function showLog(m) {
    const l = document.getElementById('log');
    l.textContent = m;
    l.style.display = 'block';
}
function hideLog() {
    document.getElementById('log').style.display = 'none';
}

// CTRL+Enter
document.getElementById('input').addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'Enter') deobfuscate();
});
</script>

</body>
</html>
